global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "agent"
    static_configs:
      - targets: ["agent:9090"]
    metrics_path: /metrics

  - job_name: "mock_api"
    static_configs:
      - targets: ["mock_api:8080"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
