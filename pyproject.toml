[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-security-lab"
version = "0.1.0"
description = "AI Agent Security Testing Lab — offensive & defensive research for the security community"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=0.2.0",
    "redis>=5.0.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "structlog>=24.0.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
]
autogen = [
    "autogen-agentchat>=0.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
