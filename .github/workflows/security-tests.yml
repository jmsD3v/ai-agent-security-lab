name: Security Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC

permissions:
  contents: read
  security-events: write   # for SARIF upload

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=agent --cov=monitor --cov=defense --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  security-tests:
    name: Security Tests (OWASP LLM Top 10 + MITRE ATLAS)
    runs-on: ubuntu-latest
    env:
      AGENT_MODE: deterministic
      FILE_SANDBOX_PATH: /tmp/sandbox
      ALLOWED_API_DOMAINS: mock_api
      MEMORY_PERSIST: "false"
      LOG_LEVEL: WARNING
      AUDIT_LOG_PATH: reports/audit.jsonl

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create sandbox
        run: mkdir -p /tmp/sandbox reports

      - name: Run security tests — Prompt Injection (LLM01)
        run: pytest tests/security/test_prompt_injection.py -v --tb=short

      - name: Run security tests — Tool Abuse (LLM05/06/10)
        run: pytest tests/security/test_tool_abuse.py -v --tb=short

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-${{ github.sha }}
          path: reports/audit.jsonl
          retention-days: 30

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -f infra/Dockerfile.agent -t agent-lab:ci .

      - name: Build mock_api image
        run: docker build -f infra/Dockerfile.mock_api -t mockapi-lab:ci .

      - name: Verify non-root user in agent
        run: |
          USER=$(docker run --rm --entrypoint whoami agent-lab:ci)
          echo "Agent running as: $USER"
          [ "$USER" = "agent" ] || (echo "ERROR: agent running as root!" && exit 1)

  trivy-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -f infra/Dockerfile.agent -t agent-lab:scan .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "agent-lab:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
