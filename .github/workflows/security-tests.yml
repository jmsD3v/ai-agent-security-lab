name: Security Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC

permissions:
  contents: read
  security-events: write   # for SARIF upload to GitHub Security tab

env:
  AGENT_MODE: deterministic
  FILE_SANDBOX_PATH: /tmp/sandbox
  ALLOWED_API_DOMAINS: mock_api
  MEMORY_PERSIST: "false"
  REDACT_PII: "true"
  LOG_LEVEL: WARNING
  AUDIT_LOG_PATH: reports/audit.jsonl

jobs:
  # ────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          mkdir -p /tmp/sandbox reports
          pytest tests/unit/ -v --tb=short \
            --cov=agent --cov=monitor --cov=defense \
            --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/unit-results.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: reports/coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-results-${{ github.sha }}
          path: reports/unit-results.xml

  # ────────────────────────────────────────────────────────────────────────
  security-tests:
    name: Security Tests (OWASP LLM Top 10 + MITRE ATLAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create sandbox and reports directory
        run: mkdir -p /tmp/sandbox reports

      - name: Security tests — Prompt Injection (LLM01/AML.T0051)
        run: pytest tests/security/test_prompt_injection.py -v --tb=short

      - name: Security tests — Tool Abuse (LLM05/06/10)
        run: pytest tests/security/test_tool_abuse.py -v --tb=short

      - name: Security tests — Memory Poisoning (LLM04/08)
        run: pytest tests/security/test_mem_poison.py -v --tb=short

      - name: Security tests — Social Engineering (LLM01/06)
        run: pytest tests/security/test_social_engineering.py -v --tb=short

      - name: Security tests — Supply Chain (LLM03/AML.T0040)
        run: pytest tests/security/test_supply_chain.py -v --tb=short

      - name: Security tests — Multimodal (LLM01/02)
        run: pytest tests/security/test_multimodal.py -v --tb=short

      - name: Run attack suites to generate audit log
        run: |
          python -m attacks.prompt_injection  || true
          python -m attacks.supply_chain      || true
          python -m attacks.multimodal        || true
          python -m attacks.social_engineering || true

      - name: Generate SARIF report from audit log
        if: hashFiles('reports/audit.jsonl') != ''
        run: |
          python reports/generate_sarif.py \
            --input reports/audit.jsonl \
            --output reports/results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('reports/results.sarif') != ''
        with:
          sarif_file: reports/results.sarif
          category: ai-agent-security-lab

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-log-${{ github.sha }}
          path: |
            reports/audit.jsonl
            reports/results.sarif
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          mkdir -p /tmp/sandbox reports
          pytest tests/integration/ -v --tb=short \
            --junitxml=reports/integration-results.xml

      - name: Upload integration results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results-${{ github.sha }}
          path: reports/integration-results.xml

  # ────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build agent image
        run: docker build -f infra/Dockerfile.agent -t agent-lab:ci .

      - name: Build mock_api image
        run: docker build -f infra/Dockerfile.mock_api -t mockapi-lab:ci .

      - name: Verify non-root user in agent
        run: |
          USER=$(docker run --rm --entrypoint whoami agent-lab:ci)
          echo "Agent running as: $USER"
          [ "$USER" = "agent" ] || (echo "ERROR: agent running as root!" && exit 1)

      - name: Verify read-only filesystem
        run: docker run --rm --read-only agent-lab:ci python -c "print('read-only OK')"

  # ────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Container CVE Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v7

      - name: Build image for scanning
        run: docker build -f infra/Dockerfile.agent -t agent-lab:scan .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "agent-lab:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true   # solo lo que tiene parche publicado
          exit-code: "0"   # report only — don't fail build

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan
